name: Image CI timing

on:
  push:
    branches: ["codex/ci-image-timing-20261031"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Image tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      # Rustの画像受入試験は本体Javaをコンパイルする。個人のGradleキャッシュに依存しない。
      - name: Install image test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgoogle-gson-java
      # 計測用ブランチだけのCI。本体の時間制限と試験のassertは変えない。
      - name: Build Rust library tests
        run: /usr/bin/time -p ./dogido-rust/cargo.sh test --lib --locked --no-run
      - name: Measure the two Java to Rust image tests
        env:
          DOGIDO_ACCEPTANCE_GSON: /usr/share/java/gson.jar
          DOGIDO_ACCEPTANCE_TIMING: '1'
        run: |
          /usr/bin/time -p ./dogido-rust/cargo.sh test --lib --locked -- \
            --exact \
            dialogue::visual_runtime::acceptance_image::acceptance_image_java_protocol_to_rust_receipt_preserves_three_states \
            dialogue::visual_runtime::acceptance_image::acceptance_image_both_model_routes_send_one_current_image_and_one_comparison \
            --nocapture
