[package]
name = "dogido-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "ドギドのRust移植: Rig/MLX接続と比較の足場"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
