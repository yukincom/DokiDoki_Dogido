[package]
name = "dogido-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "ドギドのRust移植: Rig/MLX接続と比較の足場"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
regex = "=1.12.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "=0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "process", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
