<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>ドギドのあんちょこ</title>
<style>
:root{font-family:system-ui,sans-serif;color:#28302c;background:#f4f1e8;color-scheme:light}body{max-width:920px;margin:36px auto;padding:0 22px}h1{font-size:1.75rem;letter-spacing:.04em}h2{font-size:1.1rem;margin-top:0}p{line-height:1.7}a{color:#326855}section{background:#fffef8;border:1px solid #d6d4c6;border-radius:12px;padding:24px;margin:22px 0}label{display:block;margin:14px 0 6px}input,select,button{font:inherit;padding:10px;border:1px solid #acae9e;border-radius:6px;background:white;color:inherit;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;background:#376453;color:white;margin-top:16px}button:disabled{opacity:.5;cursor:default}small{color:#5b685f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}#detail{white-space:pre-wrap}#notice{min-height:1.6em;color:#7e4423}#saved article{border-top:1px solid #deded3;padding:14px 0;display:flex;align-items:center;gap:18px}#saved article div{flex:1;overflow-wrap:anywhere}#saved button{background:white;color:#654d3d;margin:0;white-space:nowrap}.reading{color:#56735c}details{margin:16px 0}details input{max-width:500px}@media(max-width:620px){.grid{grid-template-columns:1fr;gap:0}section{padding:18px}}
</style>
<header><small>ドギドのことば帳</small><h1>ドギドのあんちょこ</h1><p>言葉の説明と読みを確認できます。読みを直すときは、ここで文字を入力して保存してください。</p></header>
<details><summary>API認証を設定している場合</summary><label for="token">認証トークン</label><input id="token" type="password" autocomplete="off"><button id="reload" type="button">読み込み直す</button><p><small>トークンはこの画面を閉じると消えます。</small></p></details>
<section><h2>言葉を探す</h2><label for="search">名前・読み・説明で検索</label><input id="search" type="search" placeholder="草地、サボテン、エンダーマン…"><label for="entry">カタログの言葉</label><select id="entry"><option value="">読み込み中…</option></select><p id="detail"></p><button id="choose" type="button">この言葉の読みを直す</button></section>
<section><h2>読みを直す</h2><form id="edit"><div class="grid"><div><label for="surface">言葉の表記</label><input id="surface" required maxlength="80" placeholder="草地"></div><div><label for="reading">正しい読み（ひらがな）</label><input id="reading" required maxlength="80" pattern="[ぁ-んー]+" placeholder="くさち"></div></div><label for="wrong">使わない読み（任意・ひらがな）</label><input id="wrong" maxlength="80" pattern="[ぁ-んー]*" placeholder="そうち"><button id="save" type="submit" disabled>この読みを保存</button></form><p id="notice" role="status" aria-live="polite"></p><small>保存した読みは、次の会話や句づくりから使います。会話中の発言から読みを登録することはありません。</small></section>
<section><h2>登録した読み</h2><div id="saved"></div></section>
<p><a href="/rust-chat">会話入力へ</a> · <a href="/dogido">ドギドの表示画面へ</a></p>
<script>
const $=id=>document.getElementById(id);let data={entries:[],corrections:[],enabled:false},entryId=null,expectedId=null,busy=false;
const kinds={mob:'モブ',structure:'構造物',biome:'バイオーム',item:'アイテム',block:'ブロック'};
const messages={unauthorized:'認証トークンを確認してください。',invalid_surface:'言葉の表記を入力してください。',invalid_reading:'読みはひらがなで入力してください。',invalid_wrong_reading:'使わない読みは、正しい読みと異なるひらがなで入力してください。',catalog_entry_mismatch:'選んだ言葉と表記が一致しません。もう一度選んでください。',reading_changed:'別の更新がありました。登録した読みを読み込み直してから編集してください。',memory_disabled:'今は読みの保存が無効になっています。',reading_storage_failed:'読みを保存・読み込みできませんでした。入力は残っています。',server_stopping:'サーバーを停止しています。'};
async function api(path,method='GET',body){const headers={};if($('token').value)headers.Authorization='Bearer '+$('token').value;if(body!==undefined)headers['Content-Type']='application/json';const r=await fetch(path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(messages[v.detail]||'処理できませんでした。入力内容と接続を確認してください。');return v;}
function note(s){$('notice').textContent=s instanceof Error?s.message:s;}
function setBusy(value){busy=value;for(const el of document.querySelectorAll('input,select,button'))el.disabled=value;$('save').disabled=value||!data.enabled;$('choose').disabled=value||!$('entry').value;}
function current(surface){return data.corrections.find(r=>r.surface===surface);}
function effective(e){return current(e.surface)?.reading??e.reading;}
function form(surface,source=null){const row=current(surface);entryId=source;expectedId=row?.id||null;$('surface').value=surface;$('reading').value=row?.reading||'';$('wrong').value=row?.wrong_reading||'';if(!$('reading').value&&source)$('reading').value=data.entries.find(e=>e.id===source)?.reading||'';}
function describe(){const e=data.entries.find(e=>e.id===$('entry').value);$('detail').textContent=e?[effective(e)?'読み：'+effective(e):'',e.note].filter(Boolean).join('\n'):'';$('choose').disabled=busy||!e;}
function options(){const query=$('search').value.trim().toLowerCase();const rows=data.entries.filter(e=>!query||[e.surface,effective(e),e.note,e.id].some(s=>s.toLowerCase().includes(query)));$('entry').replaceChildren(...rows.map(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=e.surface+' · '+(kinds[e.kind]||e.kind);return o;}));describe();}
function saved(){const box=$('saved');box.replaceChildren();if(!data.corrections.length){box.textContent='登録した読みはまだありません。';return;}for(const row of data.corrections){const article=document.createElement('article'),desc=document.createElement('div'),name=document.createElement('strong'),reading=document.createElement('p');name.textContent=row.surface;reading.textContent=row.reading;reading.className='reading';desc.append(name,reading);const edit=document.createElement('button');edit.type='button';edit.textContent='編集';edit.onclick=()=>{form(row.surface,row.source&&data.entries.some(e=>e.id===row.source)?row.source:null);$('reading').focus();};const remove=document.createElement('button');remove.type='button';remove.textContent='登録を取り消す';remove.onclick=async()=>{if(busy)return;setBusy(true);try{await api('/api/v1/catalog/readings','DELETE',{surface:row.surface,expected_id:row.id});data.corrections=data.corrections.filter(r=>r.surface!==row.surface);options();saved();if($('surface').value===row.surface)form(row.surface,entryId);note('「'+row.surface+'」の読み登録を取り消しました。');}catch(e){note(e);}finally{setBusy(false);}};article.append(desc,edit,remove);box.append(article);}}
async function load(){data=await api('/api/v1/catalog');options();saved();$('save').disabled=busy||!data.enabled;if(!data.enabled)note(messages.memory_disabled);}
$('reload').onclick=async()=>{try{await load();const surface=$('surface').value.trim();if(surface)form(surface,entryId);note(data.enabled?'読み込みました。':messages.memory_disabled);}catch(e){note(e);}};
$('search').oninput=options;$('entry').onchange=describe;$('choose').onclick=()=>{const e=data.entries.find(e=>e.id===$('entry').value);if(e){form(e.surface,e.id);$('reading').focus();}};
$('surface').onchange=()=>{const surface=$('surface').value.trim();form(surface);};
$('edit').onsubmit=async event=>{event.preventDefault();if(busy||!data.enabled)return;setBusy(true);const surface=$('surface').value.trim(),source=entryId;try{const result=await api('/api/v1/catalog/readings','PUT',{surface,reading:$('reading').value.trim(),wrong_reading:$('wrong').value.trim()||null,entry_id:source,expected_id:expectedId});data.corrections=data.corrections.filter(r=>r.surface!==surface);data.corrections.push(result.correction);options();saved();form(surface,source);note('「'+surface+'」の読みを保存しました。');}catch(e){note(e);}finally{setBusy(false);}};
load().catch(note);
</script></html>
