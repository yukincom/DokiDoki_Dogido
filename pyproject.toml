[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dogido-server"
version = "0.1.0"
description = "Local SDK and configuration helpers for the Rust DokiDoki Dogido runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
web-research = ["mcp==1.28.0"]
# テスト・開発用（本番サーバー起動だけなら不要）
dev = [
  "pytest>=8.0",
  "jsonschema[format]>=4.23",
  "ruff>=0.9,<1",
]
# VOICEVOX 誤読補正（MeCab バインディング + UniDic lite）。無くても起動可・例外表のみ
tts-reading = [
  "fugashi[unidic-lite]>=1.3",
]
# Apple Intelligence の SystemLanguageModel。Xcode 26+ と macOS 26+ が必要。
os-ai-apple = [
  "apple-fm-sdk>=0.2.1,<0.3; platform_system == 'Darwin'",
  # apple-fm-sdk は setuptools>=75 を要求し、Torch 2.11 は <82 を要求する。
  "setuptools>=75.3.2,<82; platform_system == 'Darwin'",
]
# Windows は WinML、macOS/Linux は cross-platform runtime。
# 同じ環境へ両方を入れると依存が衝突するため platform marker で分ける。
os-ai-foundry = [
  "foundry-local-sdk-winml>=1.0,<2; platform_system == 'Windows'",
  "foundry-local-sdk>=1.0,<2; platform_system != 'Windows'",
]

[tool.setuptools.packages.find]
include = ["dogido_server*"]

[tool.setuptools.package-data]
dogido_server = ["runtime_defaults.json", "llm/companion_prompts.json", "llm/reaction_situations.json", "language_dialogue/source_cards.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# 初回導入では、既存コードを大量に書き換えず、構文破損や実行不能な
# Pyflakes エラーを全体で防ぐ。規則は既存違反を整理しながら段階的に増やす。
select = ["E9", "F63", "F7"]
