[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dogido-server"
version = "0.1.0"
description = "Realtime event-driven voice server for DokiDoki Dogido"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "orjson>=3.10",
  "PyYAML>=6.0",
  "mlx-lm",
  "py_trees>=2.4.0",
]

[project.optional-dependencies]
# テスト・開発用（本番サーバー起動だけなら不要）
dev = [
  "pytest>=8.0",
]
# VOICEVOX 誤読補正（MeCab バインディング + UniDic lite）。無くても起動可・例外表のみ
tts-reading = [
  "fugashi[unidic-lite]>=1.3",
]
# Apple Intelligence の SystemLanguageModel。Xcode 26+ と macOS 26+ が必要。
os-ai-apple = [
  "apple-fm-sdk>=0.2.1,<0.3; platform_system == 'Darwin'",
  # apple-fm-sdk は setuptools>=75 を要求し、Torch 2.11 は <82 を要求する。
  "setuptools>=75.3.2,<82; platform_system == 'Darwin'",
]
# Windows は WinML、macOS/Linux は cross-platform runtime。
# 同じ環境へ両方を入れると依存が衝突するため platform marker で分ける。
os-ai-foundry = [
  "foundry-local-sdk-winml>=1.0,<2; platform_system == 'Windows'",
  "foundry-local-sdk>=1.0,<2; platform_system != 'Windows'",
]

[project.scripts]
dogido-server = "dogido_server.app:main"
dogido-replay = "dogido_server.replay:main"
dogido-smoke-test = "dogido_server.smoke_test:main"

[tool.setuptools.packages.find]
include = ["dogido_server*"]
